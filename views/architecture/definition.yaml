# storage of the produced ViewSpec belongs to AI Workspace (.knowledge/views/).
id: software-system-design/architecture/default
view_type: architecture

source:
  domain: software-system-design

spec_schema:
  id: ArchitectureViewSpec
  version: 1

operations:
  create:
    module: architecture_view
    function: create_spec
  view_model:
    module: architecture_view
    function: internal_architecture_provider

providers:
